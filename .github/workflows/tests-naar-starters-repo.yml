name: Sync Java tests

on:
  push:
    branches:
      - main
    paths:
      - "**/src/test/java/**"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: sync-java-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v7

      - name: Checkout public repository
        uses: actions/checkout@v7
        with:
          repository: HoGent-OOSD-I/h03-oefeningen-starters
          token: ${{ secrets.ADOC_SYNC_TOKEN }}
          path: public

      - name: Sync test files to public repository
        run: |
          # 1. Verwijder alle bestaande .java bestanden in de doelrepo (behalve git bestanden)
          find public -maxdepth 1 -type f -name "*Test.java" -delete

          # 2. Kopieer alle huidige testbestanden over
          find . -maxdepth 5 -not -path "./public/*" -path "*/src/test/java/*" -name "*Test.java" -exec cp {} public/ \;

      - name: Commit and push changes
        working-directory: public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "Sync testfiles van modeloplossingen"
          git push